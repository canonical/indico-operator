name: Provide approval for bot PRs

on:
  pull_request:

jobs:
  bot_pr_approval:
    # The reusable workflow approves with GITHUB_TOKEN, which acts as
    # github-actions[bot]. GitHub rejects approving your own pull request, so
    # skip PRs authored by that same identity.
    if: github.event.pull_request.user.login != 'github-actions[bot]'
    permissions:
      pull-requests: write
    uses: canonical/operator-workflows/.github/workflows/bot_pr_approval.yaml@main
    secrets: inherit
