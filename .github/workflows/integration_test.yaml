name: Integration tests

on:
  pull_request:
  schedule:
  - cron: "0 15 * * SAT"

jobs:
  integration-test:
    uses: canonical/charm-ci/.github/workflows/integration-test.yml@14b1cf49d48b9d5b96192d9bca2890c98b7295cf # v1.0.2
    permissions:
      actions: read
      contents: read
      packages: write
    secrets: inherit
    with:
      working-directory: .
      # Both integration backends (Juju 3 and Juju 4)
      spread-jobs-include: "integration-test*-ci:*"
  required_status_checks:
    name: Required Integration Test Status Checks
    runs-on: ubuntu-latest
    needs:
    - integration-test
    if: always() && !cancelled()
    timeout-minutes: 5
    steps:
    - name: Check integration-test status
      run: |
        RESULT="${{ needs.integration-test.result }}"
        if [ "$RESULT" = "success" ] || [ "$RESULT" = "skipped" ]; then
          exit 0
        else
          echo "integration-test failed with status: $RESULT"
          exit 1
        fi
